<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew & Bean</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8f5f0;
            color: #333;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            background-color: #3e2723;
            color: white;
        }

        nav h1 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #3e2723;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: #6d4c41;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .about {
            text-align: center;
            padding: 60px 20px;
            background-color: white;
        }

        .about h2 {
            margin-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #3e2723;
            color: white;
        }
    </style>
</head>

<body>

    <nav>
        <h1>☕ Brew & Bean</h1>

        <div>
            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <h2>Good Coffee. Good Mood.</h2>
        <p>Freshly brewed coffee made with love, one cup at a time.</p>
        <a href="#" class="btn">Explore Our Menu</a>
    </section>

    <section class="about">
        <h2>About Us</h2>
        <p>
            Brew & Bean is a cozy little coffee shop where great coffee
            and good conversations come together.
        </p>
    </section>

    <footer>
        <p>© 2026 Brew & Bean. All rights reserved.</p>
    </footer>

</body>
</html>
