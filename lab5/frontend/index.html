<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Brew & Bean</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f5f0;
            color: #3e2723;
        }

        nav {
            background: #3e2723;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav h1 {
            font-size: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #d7b899;
        }

        .container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 40px;
        }

        .heading h2 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #795548;
            font-size: 17px;
        }

        .form-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(62, 39, 35, 0.12);
            max-width: 650px;
            margin: auto;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #d7ccc8;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #6d4c41;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #6d4c41;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4e342e;
        }

        footer {
            margin-top: 70px;
            background: #3e2723;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <nav>
        <h1>☕ Brew & Bean</h1>

        <div>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="enquiry.html">Enquiry</a>
        </div>
    </nav>

    <div class="container">

        <div class="heading">
            <h2>Have a Question? ☕</h2>
            <p>We'd love to hear from you. Send us your enquiry!</p>
        </div>

        <div class="form-box">

            <form>

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="type">Enquiry Type</label>
                <select id="type">
                    <option>Select an option</option>
                    <option>General Enquiry</option>
                    <option>Menu & Pricing</option>
                    <option>Table Reservation</option>
                    <option>Events</option>
                </select>

                <label for="message">Your Message</label>
                <textarea id="message" placeholder="Write your enquiry here..."></textarea>

                <button type="submit">Send Enquiry</button>

            </form>

        </div>

    </div>

    <footer>
        <p>© 2026 Brew & Bean | Made with ☕ & ❤️</p>
    </footer>

</body>
</html>
